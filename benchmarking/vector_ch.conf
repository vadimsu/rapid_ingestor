[sources.fluent_in]
type = "fluent"
address = "0.0.0.0:24224"
#mode = "unix"
#path = "/tmp/seastar_forward.sock"
[transforms.strip_metadata]
type = "remap"
inputs = ["fluent_in"]
source = """
# We stitch the fields back into the raw text string format your app actually wrote.
# # This completely bypasses sending host, timestamp, tag, or source_type.
. = "field0=" + string!(.field0) + ",field1=" + string!(.field1) + ",field2=" + string!(.field2) + ",field3=" + string!(.field3) + ",field4=" + string!(.field4) + ",field5=" + string!(.field5)

#
# # Instantly drop every other key in memory so Vector only handles this string
"""

# Suppress heavy backpressure memory allocations during stress tests
#receive_buffer_bytes = 10485760 # 10MB TCP window

[sinks.clickhouse_output]
type = "http"
inputs = ["strip_metadata"]
#inputs = ["fluent_in"]
uri = "http://localhost:8123/?query=INSERT+INTO+events.events+FORMAT+TabSeparated"   # Change to your ClickHouse host; use https:// and port 8443 for TLS/Cloud
#database = "events"                 # Your target ClickHouse database
#table = "events"                   # Your target ClickHouse table
#format = "json_each_row"             # Sends data as newline-delimited JSON
#skip_unknown_fields = true           # Ignores JSON keys that don't match your ClickHouse columns

encoding.codec = "text"

[sinks.clickhouse_output.auth]
strategy = "basic"
user = "default"
password = "default"           # Leave empty or omit if authentication is disabled

# Optional: Performance tuning for ClickHouse batching
[sinks.clickhouse_output.batch]
max_events = 10000000                  # Inserts up to 10,000 rows at once
timeout_secs = 1                    # Forces an insert every 1 second even if max_events isn't met
print_interval_secs = 1 

